version: "3.9"

services:

  db:

    image: postgres:16

    container_name: bookinghub-postgres

    restart: always

    environment:

      POSTGRES_DB: bookinghub
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: secret

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./database/migrations:/migrations
      - ./database/seed:/seed
      - ./database/init/init.sh:/docker-entrypoint-initdb.d/init.sh

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookinghub"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:

    build: ./api

    container_name: bookinghub-api

    restart: always

    depends_on:
      db:
        condition: service_healthy

    environment:

      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: bookinghub
      DATABASE_USER: booking
      DATABASE_PASSWORD: secret

    ports:
      - "8000:8000"

    volumes:
      - ./api:/app
      - ./database:/database

volumes:
  postgres_data: